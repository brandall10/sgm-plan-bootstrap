<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" role="img" aria-labelledby="title desc">
  <title id="title">Offline recovery behavior</title>
  <desc id="desc">A successful save preserves a restorable snapshot; failures and invalid data remain explicit; start over fences queued saves.</desc>
  <style>
    .box { fill: #f4f7fb; stroke: #24415f; stroke-width: 2; }
    .accent { fill: #e5f5ed; stroke: #17633c; stroke-width: 2; }
    .warn { fill: #fff3d9; stroke: #8a5a00; stroke-width: 2; }
    text { font: 15px system-ui, sans-serif; fill: #152333; }
    .small { font-size: 12px; }
    path { fill: none; stroke: #315a7d; stroke-width: 2; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#315a7d" />
    </marker>
  </defs>
  <rect class="box" x="20" y="95" width="135" height="64" rx="12" />
  <text x="87" y="122" text-anchor="middle">session work</text>
  <text class="small" x="87" y="143" text-anchor="middle">new generation</text>
  <rect class="accent" x="225" y="28" width="160" height="64" rx="12" />
  <text x="305" y="55" text-anchor="middle">write succeeds</text>
  <text class="small" x="305" y="76" text-anchor="middle">saved + restorable</text>
  <rect class="warn" x="225" y="174" width="160" height="64" rx="12" />
  <text x="305" y="201" text-anchor="middle">write fails</text>
  <text class="small" x="305" y="222" text-anchor="middle">unsaved + prior kept</text>
  <rect class="box" x="470" y="28" width="125" height="64" rx="12" />
  <text x="532" y="55" text-anchor="middle">restore</text>
  <text class="small" x="532" y="76" text-anchor="middle">resume snapshot</text>
  <rect class="warn" x="470" y="174" width="125" height="64" rx="12" />
  <text x="532" y="201" text-anchor="middle">unavailable</text>
  <text class="small" x="532" y="222" text-anchor="middle">invalid snapshot</text>
  <rect class="accent" x="640" y="95" width="100" height="64" rx="12" />
  <text x="690" y="122" text-anchor="middle">start over</text>
  <text class="small" x="690" y="143" text-anchor="middle">fence queued</text>
  <path d="M155 112 C185 80 198 66 225 60" />
  <path d="M155 142 C185 175 198 194 225 204" />
  <path d="M385 60 L470 60" />
  <path d="M385 204 L470 204" />
  <path d="M595 204 C620 204 620 145 640 136" />
</svg>
