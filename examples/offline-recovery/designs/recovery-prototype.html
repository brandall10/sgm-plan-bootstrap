<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recovery choice mock</title>
    <link rel="stylesheet" href="./recovery-prototype.css" />
  </head>
  <body>
    <main class="mock-shell">
      <p class="eyebrow">Illustrative prototype · mock behavior</p>
      <h1>Continue your offline practice?</h1>
      <p class="summary">A local snapshot contains 8 completed exercises from yesterday.</p>
      <div class="actions" aria-label="Mock recovery actions">
        <button id="restore" type="button">Restore snapshot</button>
        <button id="start-over" class="secondary" type="button">Start over</button>
      </div>
      <p id="mock-result" class="result" role="status">No real exercise data is changed by this mock.</p>
    </main>
    <script src="./recovery-prototype.js"></script>
  </body>
</html>
