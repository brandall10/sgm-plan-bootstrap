<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 180" role="img" aria-labelledby="title desc">
  <title id="title">Save outcome distinction</title>
  <desc id="desc">Completion leads to a persistence attempt, which reports saved only on success and unsaved on failure.</desc>
  <style>
    .box { fill: #f4f7fb; stroke: #24415f; stroke-width: 2; }
    .good { fill: #e5f5ed; stroke: #17633c; stroke-width: 2; }
    .bad { fill: #fff3d9; stroke: #8a5a00; stroke-width: 2; }
    text { font: 15px system-ui, sans-serif; fill: #152333; }
    path { fill: none; stroke: #315a7d; stroke-width: 2; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#315a7d" />
    </marker>
  </defs>
  <rect class="box" x="20" y="58" width="130" height="64" rx="12" />
  <text x="85" y="85" text-anchor="middle">exercise done</text>
  <text x="85" y="106" text-anchor="middle">caller asks to save</text>
  <rect class="box" x="230" y="58" width="160" height="64" rx="12" />
  <text x="310" y="85" text-anchor="middle">persist snapshot</text>
  <text x="310" y="106" text-anchor="middle">wait for result</text>
  <rect class="good" x="470" y="20" width="125" height="54" rx="12" />
  <text x="532" y="53" text-anchor="middle">saved</text>
  <rect class="bad" x="470" y="106" width="125" height="54" rx="12" />
  <text x="532" y="139" text-anchor="middle">unsaved</text>
  <path d="M150 90 L230 90" />
  <path d="M390 78 C425 67 436 48 470 47" />
  <path d="M390 103 C425 113 436 133 470 133" />
</svg>
